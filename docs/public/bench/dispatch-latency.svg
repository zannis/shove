</text>
<text x="24" y="401" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="14.516129032258064" opacity="1" fill="#6E7681">
the v4 dispatch percentiles time publish → handler entry while the whole corpus is published concurrently
</text>
<text x="24" y="420" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="14.516129032258064" opacity="1" fill="#6E7681">
with the drain: under a saturated backlog that is queue residency (median ≈ half the drain window), which
</text>
<text x="24" y="439" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="14.516129032258064" opacity="1" fill="#6E7681">
scales with corpus size and the publish/drain rate ratio — not a per-message dispatch cost, and not
</text>
<text x="24" y="458" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="14.516129032258064" opacity="1" fill="#6E7681">
comparable across backends
</text>
<text x="24" y="477" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="14.516129032258064" opacity="1" fill="#6E7681">
bars will be published once the harness measures dispatch latency under matched load
</text>
