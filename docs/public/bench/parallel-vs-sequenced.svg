<text x="24" y="18" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="20.967741935483872" opacity="1" fill="#6E7681">
Parallel vs sequenced consume
</text>
<text x="24" y="48" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="14.516129032258064" opacity="1" fill="#6E7681">
64 B payload — least-parallel measurement per mode — what ordering costs — higher is better
</text>
<text x="24" y="329" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="14.516129032258064" opacity="1" fill="#6E7681">
kafka, nats, rabbitmq, redis / sequenced (fifo): lower bound (muted bar) — this window cannot separate setup
</text>
<text x="24" y="348" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="14.516129032258064" opacity="1" fill="#6E7681">
from drain, so the true rate is at least the bar shown
</text>
<text x="24" y="367" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="14.516129032258064" opacity="1" fill="#6E7681">
nats, rabbitmq, redis / parallel, sequenced (fifo): measured at 8 workers (the least-parallel count the
</text>
<text x="24" y="386" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="14.516129032258064" opacity="1" fill="#6E7681">
measured modes share)
</text>
<text x="24" y="405" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="14.516129032258064" opacity="1" fill="#6E7681">
inmemory / sequenced (fifo): measured, but every window under 1 s — too short for the throughput to be a
</text>
<text x="24" y="424" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="14.516129032258064" opacity="1" fill="#6E7681">
rate, so none is published (not even as a lower bound)
</text>
<text x="24" y="443" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="14.516129032258064" opacity="1" fill="#6E7681">
sqs / parallel, sequenced (fifo): not measured in this document: SQS runs only against LocalStack
</text>
<text x="24" y="462" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="14.516129032258064" opacity="1" fill="#6E7681">
(non-representative by design) and requires a LocalStack Pro auth token, which is unavailable in the
</text>
<text x="24" y="481" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="14.516129032258064" opacity="1" fill="#6E7681">
environment that produced these results
</text>
<text x="24" y="500" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="14.516129032258064" opacity="1" fill="#6E7681">
inmemory, nats, rabbitmq, redis, sqs / batch: run_batch is implemented only for the Kafka backend; no other
</text>
<text x="24" y="519" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="14.516129032258064" opacity="1" fill="#6E7681">
backend exposes a batch consume primitive
</text>
<text x="24" y="538" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="14.516129032258064" opacity="1" fill="#6E7681">
batch bars: up to 500 messages or 250 ms per batch
</text>
<text x="24" y="557" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="14.516129032258064" opacity="1" fill="#6E7681">
