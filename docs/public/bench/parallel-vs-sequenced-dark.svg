<text x="24" y="18" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="20.967741935483872" opacity="1" fill="#FFFFFF">
Parallel vs sequenced consume
</text>
<text x="24" y="48" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="14.516129032258064" opacity="1" fill="#C3C2B7">
64 B payload — least-parallel measurement per mode — what ordering costs — higher is better
</text>
<text x="24" y="294" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#C3C2B7">
sqs: shape only — not representative (LocalStack, not AWS); magnitudes are not published
</text>
<text x="24" y="310" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#C3C2B7">
redis / sequenced (fifo): failed to run — absent, not zero; see failures[] in the results document
</text>
<text x="24" y="326" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#C3C2B7">
kafka, nats, rabbitmq / sequenced (fifo): lower bound (muted bar) — this window cannot separate setup from drain, so
</text>
<text x="24" y="342" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#C3C2B7">
the true rate is at least the bar shown
</text>
<text x="24" y="358" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#C3C2B7">
sqs / sequenced (fifo): lower bound from a window mixing setup and drain; shape only, so its height is not the bound
</text>
<text x="24" y="374" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#C3C2B7">
redis / parallel, batch: measured at 2 workers (the least-parallel count the measured modes share)
</text>
<text x="24" y="390" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#C3C2B7">
nats, rabbitmq, sqs / parallel, sequenced (fifo), batch: measured at 8 workers (the least-parallel count the measured
</text>
<text x="24" y="406" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#C3C2B7">
modes share)
</text>
<text x="24" y="422" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#C3C2B7">
inmemory / sequenced (fifo): measured, but every window under 1 s — too short to publish as a rate, even a lower bound
</text>
<text x="24" y="438" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#C3C2B7">
sqs / batch: up to 10 messages or 250 ms per batch
</text>
<text x="24" y="454" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#C3C2B7">
inmemory, kafka, nats, rabbitmq, redis / batch: up to 500 messages or 250 ms per batch
</text>
<text x="24" y="470" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#C3C2B7">
drain (inmemory, kafka, nats, rabbitmq, redis, sqs): each consume_batch / consume_parallel point is the processing
</text>
<text x="24" y="486" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#C3C2B7">
rate of the consumers from the moment every worker was assigned until 90 % of its corpus, published before they
</text>
<text x="24" y="502" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#C3C2B7">
started, had been consumed; no producer ran in the window
</text>
<text x="24" y="518" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#C3C2B7">
corpus differs by backend: inmemory, kafka, nats, rabbitmq, redis 6.0M; sqs 60k — a smaller corpus is a shorter
</text>
<text x="24" y="534" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#C3C2B7">
window, not a different measurement
</text>
<text x="24" y="550" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#C3C2B7">
sqs: measured as supervisor — this backend&apos;s spelling of consume_parallel (the same run primitive)
</text>
<text x="24" y="566" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#C3C2B7">
redis: 2 cells in this slice failed to run — absent, not zero; see failures[]
</text>
<text x="24" y="582" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#898781">
