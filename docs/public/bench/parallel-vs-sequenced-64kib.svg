</text>
<text x="24" y="342" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#52514E">
inmemory, kafka, nats, rabbitmq / sequenced (fifo): lower bound (muted bar) — this window cannot separate setup from
</text>
<text x="24" y="358" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#52514E">
