<text x="24" y="18" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="20.967741935483872" opacity="1" fill="#0B0B0B">
Parallel vs sequenced consume
</text>
<text x="24" y="48" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="14.516129032258064" opacity="1" fill="#52514E">
64 KiB payload — least-parallel measurement per mode — what ordering costs — higher is better
</text>
<text x="24" y="294" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#52514E">
sqs: shape only — not representative (LocalStack, not AWS); magnitudes are not published
</text>
<text x="24" y="310" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#52514E">
kafka, nats, rabbitmq, redis / sequenced (fifo): lower bound (muted bar) — this window cannot separate setup from
</text>
<text x="24" y="326" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#52514E">
drain, so the true rate is at least the bar shown
</text>
<text x="24" y="342" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#52514E">
sqs / sequenced (fifo): lower bound from a window mixing setup and drain; shape only, so its height is not the bound
</text>
<text x="24" y="358" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#52514E">
kafka / parallel: measured at 2 workers (no worker count is shared by the measured modes, so the bars are not directly
</text>
<text x="24" y="374" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#52514E">
comparable)
</text>
<text x="24" y="390" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#52514E">
rabbitmq, redis / sequenced (fifo): measured at 8 workers (no worker count is shared by the measured modes, so the
</text>
<text x="24" y="406" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#52514E">
bars are not directly comparable)
</text>
<text x="24" y="422" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#52514E">
nats, sqs / parallel, sequenced (fifo), batch: measured at 8 workers (the least-parallel count the measured modes
</text>
<text x="24" y="438" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#52514E">
share)
</text>
<text x="24" y="454" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#52514E">
inmemory / sequenced (fifo): measured, but every window under 1 s — too short to publish as a rate, even a lower bound
</text>
<text x="24" y="470" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#52514E">
sqs / batch: up to 10 messages or 250 ms per batch
</text>
<text x="24" y="486" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#52514E">
inmemory, kafka, nats, rabbitmq, redis / batch: up to 500 messages or 250 ms per batch
</text>
<text x="24" y="502" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#52514E">
drain (inmemory, kafka, nats, rabbitmq, redis, sqs): each consume_batch / consume_parallel point is the processing
</text>
<text x="24" y="518" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#52514E">
rate of the consumers from the moment every worker was assigned until 90 % of its corpus, published before they
</text>
<text x="24" y="534" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#52514E">
started, had been consumed; no producer ran in the window
</text>
<text x="24" y="550" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#52514E">
corpus differs by backend: inmemory 524k; kafka, nats, rabbitmq, redis, sqs 49k — a smaller corpus is a shorter
</text>
<text x="24" y="566" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#52514E">
window, not a different measurement
</text>
<text x="24" y="582" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#52514E">
sqs: measured as supervisor — this backend&apos;s spelling of consume_parallel (the same run primitive)
</text>
<text x="24" y="598" dy="0.76em" text-anchor="start" font-family="sans-serif" font-size="12.096774193548388" opacity="1" fill="#52514E">
rabbitmq: 1 cell in this slice failed to run — absent, not zero; see failures[]
</text>
