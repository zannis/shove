name: Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (none to skip)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - none
      # A rehearsal runs *every* step of the real release in the same job, so
      # the path being exercised cannot drift from the path that ships. Only
      # the three irreversible/outward-facing effects are withheld: the push of
      # the release commit and tag, the crates.io upload (`--dry-run`
      # substituted) and the GitHub release. Everything before them -- the
      # version bump, the package.json/lockfile sync, the GPG-signed commit and
      # tag, the changelog and the dirty-working-tree guard -- runs for real.
      dry_run:
        description: "Rehearse the release: run every step, publish nothing"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Resolve the rehearsal flag once, and fail closed: an unrecognised value
      # must not quietly mean "real release". `type: boolean` makes this
      # unreachable from the Actions UI, but a dispatch through the API can put
      # anything in the field. Read through the environment rather than
      # interpolating the input into the script.
      - name: Resolve release mode
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          case "$DRY_RUN_INPUT" in
            true)  echo "Rehearsal: nothing will be pushed or published." ;;
            false) echo "Real release." ;;
            *)
              echo "::error::dry_run must be 'true' or 'false', got '$DRY_RUN_INPUT'."
              exit 1
              ;;
          esac
          echo "DRY_RUN=$DRY_RUN_INPUT" >> "$GITHUB_ENV"

      - run: sudo apt-get update && sudo apt-get install -y librdkafka-dev libsasl2-dev

      - uses: dtolnay/rust-toolchain@1.91

      - uses: Swatinem/rust-cache@v2

      - uses: cargo-bins/cargo-binstall@v1.20.1

      - name: Install cargo-edit
        if: inputs.bump != 'none'
        run: cargo binstall -y --version 0.13.10 cargo-edit

      - name: Bump version
        if: inputs.bump != 'none'
        run: cargo set-version -q --bump ${{ inputs.bump }}

      - name: Resolve version
        id: version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: inputs.bump != 'none'

      - uses: actions/setup-node@v4
        if: inputs.bump != 'none'
        with:
          node-version: 22
          cache: pnpm

      - name: Sync package.json version
        if: inputs.bump != 'none'
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version

      - name: Update pnpm lockfile
        if: inputs.bump != 'none'
        run: pnpm install

      - name: Import GPG signing key
        if: inputs.bump != 'none'
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.BOT_GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Commit and tag
        if: inputs.bump != 'none'
        run: |
          git add Cargo.toml Cargo.lock package.json pnpm-lock.yaml
          git commit -m "release: v${{ steps.version.outputs.version }}"
          git tag -m "v${{ steps.version.outputs.version }}" "v${{ steps.version.outputs.version }}"
          # The commit and tag above are created for real even on a rehearsal --
          # signing them is a step that can fail, so it has to be exercised.
          # Only the push is withheld, leaving both objects local to the runner.
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run: not pushing v${{ steps.version.outputs.version }} to ${{ github.ref_name }}"
            git --no-pager log -1 --show-signature
            git tag -v "v${{ steps.version.outputs.version }}"
            exit 0
          fi
          git push origin "HEAD:${{ github.ref_name }}" --follow-tags

      # Generate the notes *before* `cargo publish`, the one irreversible step
      # in this job: a crate version cannot be unpublished, so anything that can
      # fail the release should fail while the run is still recoverable.
      #
      # The notes are written to $RUNNER_TEMP, *not* the working tree. `cargo
      # publish` refuses to run when the working directory has uncommitted
      # changes, and an untracked RELEASE_NOTES.md counts -- so generating them
      # in-tree before the publish (which is the whole point of this ordering)
      # makes the publish fail every time. That is exactly what happened on the
      # first v0.13.0 attempt. Keeping the file outside the repo also stops it
      # being packaged into the .crate, since `.github/` is not in Cargo.toml's
      # `exclude` list.
      - name: Generate changelog
        run: |
          cargo install -q git-cliff --locked
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="${RUNNER_TEMP}/RELEASE_NOTES.md"
          # Do not use `--latest`: on the `bump: none` path the "Commit and tag"
          # step is skipped, so the tag does not exist yet and the newest tag is
          # still the *previous* release -- `--latest` then re-emits that
          # release's notes. Resolve the range explicitly instead, and pass
          # --tag so untagged commits are attributed to the version being cut.
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' \
                   --exclude "v${VERSION}" HEAD 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            echo "Generating notes for ${PREV}..HEAD"
            git-cliff --strip header --tag "v${VERSION}" "${PREV}..HEAD" -o "$NOTES"
          else
            echo "No previous tag found; generating notes over full history"
            git-cliff --strip header --tag "v${VERSION}" -o "$NOTES"
          fi
          # Test for *blank*, not just zero-length: `--strip header` on a range
          # whose every commit was filtered leaves a file of bare newlines, which
          # `[ -s ]` reports as non-empty. That is the realistic failure -- a
          # release squashed into a single `release:` commit, which cliff.toml
          # skips -- so the weaker test would let empty notes through.
          if ! grep -q '[^[:space:]]' "$NOTES"; then
            if [ "$DRY_RUN" = "true" ]; then
              # Not a failure on a rehearsal. A rehearsal is dispatched from the
              # branch that changes *this file*, so every commit in its range is
              # a `ci:` one -- which cliff.toml skips. Stopping here would leave
              # the four steps below (the working-tree guard, the packaging and
              # the release) unexercised, which is the whole reason the rehearsal
              # exists. Say what a real release would do, substitute a stand-in
              # so those steps still have a file to read, and carry on.
              echo "::warning::No release notes for ${PREV:-<root>}..HEAD -- every commit was filtered out. A real release would fail here."
              echo "_Rehearsal stand-in: no releasable commits in ${PREV:-<root>}..HEAD._" > "$NOTES"
            else
              echo "::error::git-cliff produced no release notes for v${VERSION}. Every commit in the range was filtered out (cliff.toml skips 'ci:' and 'release:' subjects), which is what squashing a whole release into one 'release:' commit does. Write ${NOTES} by hand and re-run, or re-cut the release with the individual commits intact."
              exit 1
            fi
          fi
          cat "$NOTES"

      # Nothing after this point may write to the working tree: `cargo publish`
      # rejects a dirty one, and the next step is the irreversible publish.
      - name: Fail early if the working tree is dirty
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::Working tree is dirty going into 'cargo publish', which will refuse to run. A step above wrote into the repo; write it to \$RUNNER_TEMP instead."
            exit 1
          fi

      # Skipped on a rehearsal: `cargo publish --dry-run` never contacts the
      # registry, so minting a publish token for it would hand out a credential
      # no step uses.
      - name: Authenticate with crates.io (trusted publishing)
        id: crates-auth
        if: env.DRY_RUN != 'true'
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        run: |
          set -- cargo publish -q --all-features
          if [ "$DRY_RUN" = "true" ]; then
            set -- "$@" --dry-run
          fi
          "$@"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}

      - name: Create GitHub release
        run: |
          set -- gh release create "v${{ steps.version.outputs.version }}" \
            -F "${RUNNER_TEMP}/RELEASE_NOTES.md" \
            --target "${{ github.sha }}"
          if [ "$DRY_RUN" = "true" ]; then
            # A rehearsal cannot create the release: `gh release create` would
            # create the tag on the remote, which is the push we just withheld.
            # Assert instead that the notes file `-F` reads is still there and
            # non-blank at this point in the job -- the failure this guards
            # against is a step in between moving or clobbering it.
            if ! grep -q '[^[:space:]]' "${RUNNER_TEMP}/RELEASE_NOTES.md"; then
              echo "::error::${RUNNER_TEMP}/RELEASE_NOTES.md is missing or blank at the release step; 'gh release create -F' would fail here."
              exit 1
            fi
            echo "dry run: would run: $*"
            exit 0
          fi
          "$@"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
