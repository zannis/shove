name: Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (none to skip)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - none

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - run: sudo apt-get update && sudo apt-get install -y librdkafka-dev libsasl2-dev

      - uses: dtolnay/rust-toolchain@1.91

      - uses: Swatinem/rust-cache@v2

      - uses: cargo-bins/cargo-binstall@v1.20.1

      - name: Install cargo-edit
        if: inputs.bump != 'none'
        run: cargo binstall -y --version 0.13.10 cargo-edit

      - name: Bump version
        if: inputs.bump != 'none'
        run: cargo set-version -q --bump ${{ inputs.bump }}

      - name: Resolve version
        id: version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: inputs.bump != 'none'

      - uses: actions/setup-node@v4
        if: inputs.bump != 'none'
        with:
          node-version: 22
          cache: pnpm

      - name: Sync package.json version
        if: inputs.bump != 'none'
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version

      - name: Update pnpm lockfile
        if: inputs.bump != 'none'
        run: pnpm install

      - name: Import GPG signing key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.BOT_GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Commit version bump
        if: inputs.bump != 'none'
        run: |
          git add Cargo.toml Cargo.lock package.json pnpm-lock.yaml
          git commit -m "release: v${{ steps.version.outputs.version }}"

      # Always tag, including on the `bump: none` path a maintenance branch
      # uses. `git-cliff --latest` resolves "latest" against the tags that
      # exist when it runs: with no tag on HEAD it silently emits the
      # *previous* release's notes instead of this one's.
      - name: Tag and push
        run: |
          git tag -m "v${{ steps.version.outputs.version }}" "v${{ steps.version.outputs.version }}"
          git push origin "HEAD:${{ github.ref_name }}" --follow-tags

      - name: Generate changelog
        run: |
          cargo install -q git-cliff --locked
          git-cliff --latest --strip header -o RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "::error::git-cliff produced empty notes for v${{ steps.version.outputs.version }}. Every commit in the range was filtered (ci/release subjects are skipped) — squashing the whole release into one 'release:' commit does this. Write the notes by hand before publishing."
            exit 1
          fi

      - name: Authenticate with crates.io (trusted publishing)
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        run: cargo publish -q --all-features
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}

      - name: Create GitHub release
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            -F RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
