name: Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (none to skip)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - none

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - run: sudo apt-get update && sudo apt-get install -y librdkafka-dev libsasl2-dev

      - uses: dtolnay/rust-toolchain@1.91

      - uses: Swatinem/rust-cache@v2

      - uses: cargo-bins/cargo-binstall@v1.20.1

      - name: Install cargo-edit
        if: inputs.bump != 'none'
        run: cargo binstall -y --version 0.13.10 cargo-edit

      - name: Bump version
        if: inputs.bump != 'none'
        run: cargo set-version -q --bump ${{ inputs.bump }}

      - name: Resolve version
        id: version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: inputs.bump != 'none'

      - uses: actions/setup-node@v4
        if: inputs.bump != 'none'
        with:
          node-version: 22
          cache: pnpm

      - name: Sync package.json version
        if: inputs.bump != 'none'
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version

      - name: Update pnpm lockfile
        if: inputs.bump != 'none'
        run: pnpm install

      - name: Import GPG signing key
        if: inputs.bump != 'none'
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.BOT_GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Commit and tag
        if: inputs.bump != 'none'
        run: |
          git add Cargo.toml Cargo.lock package.json pnpm-lock.yaml
          git commit -m "release: v${{ steps.version.outputs.version }}"
          git tag -m "v${{ steps.version.outputs.version }}" "v${{ steps.version.outputs.version }}"
          git push origin "HEAD:${{ github.ref_name }}" --follow-tags

      # Generate the notes *before* `cargo publish`, the one irreversible step
      # in this job: a crate version cannot be unpublished, so anything that can
      # fail the release should fail while the run is still recoverable.
      - name: Generate changelog
        run: |
          cargo install -q git-cliff --locked
          VERSION="${{ steps.version.outputs.version }}"
          # Do not use `--latest`: on the `bump: none` path the "Commit and tag"
          # step is skipped, so the tag does not exist yet and the newest tag is
          # still the *previous* release -- `--latest` then re-emits that
          # release's notes. Resolve the range explicitly instead, and pass
          # --tag so untagged commits are attributed to the version being cut.
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' \
                   --exclude "v${VERSION}" HEAD 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            echo "Generating notes for ${PREV}..HEAD"
            git-cliff --strip header --tag "v${VERSION}" "${PREV}..HEAD" -o RELEASE_NOTES.md
          else
            echo "No previous tag found; generating notes over full history"
            git-cliff --strip header --tag "v${VERSION}" -o RELEASE_NOTES.md
          fi
          # Test for *blank*, not just zero-length: `--strip header` on a range
          # whose every commit was filtered leaves a file of bare newlines, which
          # `[ -s ]` reports as non-empty. That is the realistic failure -- a
          # release squashed into a single `release:` commit, which cliff.toml
          # skips -- so the weaker test would let empty notes through.
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "::error::git-cliff produced no release notes for v${VERSION}. Every commit in the range was filtered out (cliff.toml skips 'ci:' and 'release:' subjects), which is what squashing a whole release into one 'release:' commit does. Write RELEASE_NOTES.md by hand and re-run, or re-cut the release with the individual commits intact."
            exit 1
          fi
          cat RELEASE_NOTES.md

      - name: Authenticate with crates.io (trusted publishing)
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        run: cargo publish -q --all-features
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}

      - name: Create GitHub release
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            -F RELEASE_NOTES.md \
            --target "${{ github.sha }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
