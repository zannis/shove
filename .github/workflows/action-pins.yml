name: Action pins

# No `paths:` filter, deliberately, and it costs seconds.
#
# A filtered check cannot be a required one. GitHub reports a required check
# that is filtered out as "Expected -- waiting for status" forever, so every
# unrelated pull request would sit unmergeable; the usual response is to drop
# the requirement, at which point the gate stops being a gate. Worse, a filter
# is editable by the same pull request it is meant to police: a change that
# added an unpinned action to publish.yml *and* narrowed this filter in the
# same commit would produce a pull request where this check simply never runs
# -- nothing red, nothing to notice.
#
# This only means anything once branch protection marks it required.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  action-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # The checker is a security gate, so it is covered rather than merely
      # present: a gate that silently accepts what it cannot parse reads as
      # coverage while providing none, and only a test tells the two apart.
      - name: Test the pin checker
        run: bash .github/scripts/check-action-pins.test.sh

      # Every workflow in the tree, discovered rather than listed.
      #
      # publish.yml is the one that matters most -- `contents: write`,
      # `id-token: write`, the release signing key and the crates.io token --
      # but ci.yml and docs-build.yml are pinned too (#129), and this file
      # polices itself. A hardcoded list would leave the next workflow anyone
      # adds silently unchecked, which is the same failure this checker exists
      # to prevent: quiet non-coverage that reads as coverage.
      - name: Require every action in every workflow to be SHA-pinned
        run: |
          shopt -s nullglob
          files=(.github/workflows/*.yml .github/workflows/*.yaml)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no workflow files found -- this check cannot be passing" >&2
            exit 1
          fi
          printf 'Checking %s\n' "${files[@]}"
          .github/scripts/check-action-pins.sh "${files[@]}"
