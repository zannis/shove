name: Bench

# Manual only: the leg never gates a release and took ~13 runner-minutes of
# every CI run's concurrency budget. Run it from the Actions tab before
# merging a change that touches a hot path, or to recalibrate the baseline.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Tier A benchmark regression ──────────────────────────────────────────
  # Runs the in-process criterion suite (no Docker, no secrets) against the
  # committed baseline in benches/baselines/tier-a-ubuntu-latest.json.
  #
  # Threshold rationale: six no-op calibration runs on separate ubuntu-latest
  # runners moved the median id ~57% and the worst 2.5x with no code change —
  # the fleet's hardware diversity, not sampling noise (per-run normalization
  # does not collapse it), and the leg is a max over every id in the baseline.
  # A single threshold tight enough to matter would therefore cry wolf weekly
  # and be ignored within a week, which is worse than no leg. Instead every
  # id fails
  # at max(50%, 5x its own measured no-op spread), recorded per id in the
  # baseline. Thresholds are earned, never asserted: an early 3-run
  # calibration was breached by its own fourth no-op run (heavy tails —
  # 3 samples understate them), so the committed baseline is earned from six
  # runs and vetoed by leave-one-out replay (each five judging the sixth:
  # zero failures). Refresh with the comparator itself:
  # `bench_compare --write-baseline` over >= 2 fresh runs' criterion trees
  # (see examples/bench_compare.rs). A baseline id that was not measured at
  # all fails closed (a renamed or deleted bench must refresh the baseline in
  # the same PR).
  #
  # Deliberately NOT in require-green-ci.sh's REQUIRED_JOBS: a perf gate this
  # side of runner jitter must not be able to block a release the way the
  # deterministic legs can.
  bench-tier-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@38ae5351029910ad7674ccfad89c37cbd636f3c4 # 1.91 branch
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # rust-cache prunes plain files out of target/ but keeps the directory
      # tree, so a cache hit hands criterion every previous run's <id>/base
      # emptied of its sample.json, and criterion logs a "Failed to access
      # file" error per id while trying to compare against that phantom
      # previous run. This leg judges against the committed baseline
      # document, never against the previous run, so start with no tree.
      - name: Drop the criterion tree the cache restored
        run: rm -rf target/criterion
      - name: Run the Tier A criterion suite
        run: >
          cargo bench --no-default-features --features inmemory
          --bench pure_paths --bench inmemory_flows --bench consumer_overhead
      - name: Compare against the committed baseline
        run: >
          cargo run --no-default-features --example bench_compare --
          --criterion-dir target/criterion
          --baseline benches/baselines/tier-a-ubuntu-latest.json
      # The raw per-id estimates, for recalibrating the baseline without
      # spelunking logs: rust-cache prunes plain files out of target/, so an
      # artifact is the only durable copy a run leaves behind.
      - name: Upload criterion estimates
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tier-a-criterion-estimates
          path: target/criterion/**/new/estimates.json
