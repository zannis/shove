name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y librdkafka-dev libsasl2-dev
      - uses: dtolnay/rust-toolchain@1.91
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -- --check
      # `--all-targets` so tests/benches/examples are type-checked and linted
      # too. Without it clippy only sees the lib, and a `tests/` file gated on a
      # feature no coverage entry enables can rot silently.
      - run: cargo clippy -q --all-features --all-targets -- -D warnings
      - run: cargo clippy -q --no-default-features --all-targets -- -D warnings
      - run: cargo test --no-default-features
      # The schema-registry mock suite drives an in-process axum registry, so
      # unlike the other two SR files it needs no Docker (11 tests, ~0.2s) and
      # can run here as well as in the coverage entry. That keeps a fast signal
      # on the registry client — caching, single-flight, negative caching, auth
      # headers — that does not depend on the container-backed entry being
      # healthy. `--all-features` so it reuses the dependency build the
      # clippy/publish steps already paid for.
      - run: cargo test --all-features --test kafka_schema_registry
      - run: cargo publish --dry-run --all-features

  # `check` gates `--all-features` and `--no-default-features` only, and both
  # were already clean when four `dead_code` errors were sitting in the
  # single-backend sets: each item's only callers are behind a backend feature
  # the set does not enable. Nothing in CI could see that, so the fix could
  # regress silently and leave contributors trained to ignore clippy output on
  # the one build they actually work in. `--lib` is the scope those errors live
  # in, and keeps this to a lint rather than a second integration build.
  feature-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y librdkafka-dev libsasl2-dev
      - uses: dtolnay/rust-toolchain@1.91
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The coverage matrix's sets, plus the two publisher-only SNS builds, which
      # no coverage entry compiles on its own -- they are the sets that decide
      # whether `record_message_size` needs its `dead_code` allow.
      #
      # `--lib`, not `--all-targets`: the coverage matrix already builds every
      # other target for these same feature sets, so a test that does not
      # compile under one of them fails there. This job adds the lint pass over
      # the library, which is where a feature-gated item goes dead.
      - name: clippy --lib for every single-backend feature set
        run: |
          set -euo pipefail
          for features in \
            inmemory,metrics,sbe,env-config \
            rabbitmq,audit,rabbitmq-transactional,metrics,sbe \
            pub-aws-sns \
            pub-aws-sns,metrics \
            pub-aws-sns,aws-sns-sqs,audit,metrics,sbe \
            nats,audit,metrics,sbe,env-config \
            kafka,kafka-ssl,kafka-msk-iam,test-support,audit,metrics,sbe,env-config \
            kafka,kafka-schema-registry,protobuf \
            redis-streams,metrics,sbe \
          ; do
            echo "::group::clippy --lib --features $features"
            cargo clippy -q --lib --no-default-features --features "$features" -- -D warnings
            echo "::endgroup::"
          done

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y librdkafka-dev libsasl2-dev
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-features
      - run: cargo build --no-default-features

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91
      - name: Install cargo-audit
        run: cargo install --locked --quiet cargo-audit
      # cargo-audit re-clones the advisory DB on every run by default; caching
      # it keyed by run id keeps a fresh DB but skips the ~30s git clone.
      - name: Cache RustSec advisory DB
        uses: actions/cache@v5
        with:
          path: ~/.cargo/advisory-db
          key: cargo-audit-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            cargo-audit-db-${{ runner.os }}-
      - name: RustSec audit
        run: cargo audit --deny warnings

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for codecov-action v5 OIDC authentication; replaces the
      # long-lived CODECOV_TOKEN secret on public repos.
      id-token: write
    env:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: inmemory
            # `env-config` here and on the `nats`/`kafka` entries below: the
            # env-schema tests are gated `#[cfg(all(test, feature =
            # "env-config"))]`, so without the feature they compile to zero
            # tests and the entry still reports green. This entry covers the
            # backend-agnostic ones (`env::tests`,
            # `autoscaler::env_config_tests`). The feature is std-only and
            # adds no dependencies, so it costs this entry nothing.
            features: inmemory,metrics,sbe,env-config
          # `metrics` on every backend entry below that has a `metrics_*`
          # integration binary. Every one of those is gated
          # `#![cfg(all(feature = "<backend>", feature = "metrics"))]`, so
          # without the feature the binary compiles to zero tests and the entry
          # still reports green: coverage that asserts nothing. The feature only
          # adds counter emission behind the `metrics` facade; with no recorder
          # installed each call is a no-op, so no entry gets materially slower.
          - name: rabbitmq
            # Asserted by `metrics_rabbitmq_sequenced`.
            features: rabbitmq,audit,rabbitmq-transactional,metrics,sbe
          - name: aws-sns-sqs
            # Asserted by `metrics_sqs_sequenced`.
            features: pub-aws-sns,aws-sns-sqs,audit,metrics,sbe
          - name: nats
            # Asserted by `metrics_nats_failall` and
            # `metrics_nats_failall_no_dlq`. `env-config` runs
            # `topology::nats_env_config_tests` (NatsStreamConfig::from_env).
            features: nats,audit,metrics,sbe,env-config
          - name: kafka
            # kafka-msk-iam + test-support compile and run the MSK IAM tests,
            # including the OAUTHBEARER admin integration test (local Kafka
            # container + unsecured JWT; no AWS/LocalStack needed).
            # `metrics` asserted by `metrics_kafka_failall` and
            # `metrics_kafka_failall_no_dlq`.
            # `env-config` runs the `KafkaTopicTuning` tests.
            features: kafka,kafka-ssl,kafka-msk-iam,test-support,audit,metrics,sbe,env-config
          - name: kafka-schema-registry
            # Split out from the `kafka` entry rather than folded into it: the
            # two schema-registry suites each pin FIXED host ports (cp stack
            # 29092/18082, Redpanda 19092/18081) and cp-schema-registry is a
            # slow JVM start (~90s), so they get their own runner instead of
            # contending with the `kafka` entry's containers. `protobuf` turns
            # on the framed-protobuf scenario in the cp integration test.
            features: kafka,kafka-schema-registry,protobuf
            # `kafka-schema-registry` implies `kafka`, so without a filter this
            # entry would re-run the entire Kafka suite the `kafka` entry
            # already covers. Restrict it to the three schema-registry binaries.
            filter: -E 'binary(/^kafka_schema_registry/)'
          - name: redis-streams
            # Asserted by `metrics_redis_sequenced`, `metrics_redis_malformed`,
            # `metrics_redis_failall` and `metrics_redis_failall_no_dlq`.
            features: redis-streams,metrics,sbe
    steps:
      - uses: actions/checkout@v6
      - if: startsWith(matrix.name, 'kafka')
        run: sudo apt-get update && sudo apt-get install -y librdkafka-dev libsasl2-dev
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - run: cargo install -q cargo-llvm-cov cargo-nextest --locked
      # `matrix.filter` is unset for every entry but kafka-schema-registry,
      # where it expands to empty and the full suite runs as before.
      - run: cargo llvm-cov nextest --features ${{ matrix.features }} ${{ matrix.filter }} --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          slug: ${{ github.repository }}
          files: lcov.info
          disable_search: true
          flags: ${{ matrix.name }}
          name: ${{ matrix.name }}
          fail_ci_if_error: true
