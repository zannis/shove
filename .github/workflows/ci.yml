name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y librdkafka-dev libsasl2-dev
      - uses: dtolnay/rust-toolchain@1.91
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -- --check
      # `--all-targets` so tests/benches/examples are type-checked and linted
      # too. Without it clippy only sees the lib, and a `tests/` file gated on a
      # feature no coverage entry enables can rot silently.
      - run: cargo clippy -q --all-features --all-targets -- -D warnings
      - run: cargo clippy -q --no-default-features --all-targets -- -D warnings
      - run: cargo test --no-default-features
      # The schema-registry mock suite drives an in-process axum registry, so
      # unlike the other two SR files it needs no Docker (11 tests, ~0.2s) and
      # can run here as well as in the coverage entry. That keeps a fast signal
      # on the registry client — caching, single-flight, negative caching, auth
      # headers — that does not depend on the container-backed entry being
      # healthy. `--all-features` so it reuses the dependency build the
      # clippy/publish steps already paid for.
      - run: cargo test --all-features --test kafka_schema_registry
      - run: cargo publish --dry-run --all-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y librdkafka-dev libsasl2-dev
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-features
      - run: cargo build --no-default-features

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91
      - name: Install cargo-audit
        run: cargo install --locked --quiet cargo-audit
      # cargo-audit re-clones the advisory DB on every run by default; caching
      # it keyed by run id keeps a fresh DB but skips the ~30s git clone.
      - name: Cache RustSec advisory DB
        uses: actions/cache@v5
        with:
          path: ~/.cargo/advisory-db
          key: cargo-audit-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            cargo-audit-db-${{ runner.os }}-
      - name: RustSec audit
        run: cargo audit --deny warnings

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for codecov-action v5 OIDC authentication; replaces the
      # long-lived CODECOV_TOKEN secret on public repos.
      id-token: write
    env:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: inmemory
            features: inmemory,metrics,sbe
          - name: rabbitmq
            # `metrics` so the discard counters this backend emits are actually
            # executed: `metrics_rabbitmq_sequenced` asserts them against a real
            # broker. Without the feature the emission sites are cfg-compiled
            # out and the leg cannot observe them even in principle.
            features: rabbitmq,audit,rabbitmq-transactional,metrics,sbe
          - name: aws-sns-sqs
            # `metrics` — see the rabbitmq entry; asserted by
            # `metrics_sqs_sequenced`.
            features: pub-aws-sns,aws-sns-sqs,audit,metrics,sbe
          - name: nats
            features: nats,audit,sbe
          - name: kafka
            # kafka-msk-iam + test-support compile and run the MSK IAM tests,
            # including the OAUTHBEARER admin integration test (local Kafka
            # container + unsecured JWT; no AWS/LocalStack needed).
            features: kafka,kafka-ssl,kafka-msk-iam,test-support,audit,sbe
          - name: kafka-schema-registry
            # Split out from the `kafka` entry rather than folded into it: the
            # two schema-registry suites each pin FIXED host ports (cp stack
            # 29092/18082, Redpanda 19092/18081) and cp-schema-registry is a
            # slow JVM start (~90s), so they get their own runner instead of
            # contending with the `kafka` entry's containers. `protobuf` turns
            # on the framed-protobuf scenario in the cp integration test.
            features: kafka,kafka-schema-registry,protobuf
            # `kafka-schema-registry` implies `kafka`, so without a filter this
            # entry would re-run the entire Kafka suite the `kafka` entry
            # already covers. Restrict it to the three schema-registry binaries.
            filter: -E 'binary(/^kafka_schema_registry/)'
          - name: redis-streams
            # `metrics` — see the rabbitmq entry; asserted by
            # `metrics_redis_malformed`.
            features: redis-streams,metrics,sbe
    steps:
      - uses: actions/checkout@v6
      - if: startsWith(matrix.name, 'kafka')
        run: sudo apt-get update && sudo apt-get install -y librdkafka-dev libsasl2-dev
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - run: cargo install -q cargo-llvm-cov cargo-nextest --locked
      # `matrix.filter` is unset for every entry but kafka-schema-registry,
      # where it expands to empty and the full suite runs as before.
      - run: cargo llvm-cov nextest --features ${{ matrix.features }} ${{ matrix.filter }} --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          slug: ${{ github.repository }}
          files: lcov.info
          disable_search: true
          flags: ${{ matrix.name }}
          name: ${{ matrix.name }}
          fail_ci_if_error: true
