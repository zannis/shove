name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y librdkafka-dev libsasl2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -- --check
      - run: cargo clippy -q --all-features -- -D warnings
      - run: cargo clippy -q --no-default-features -- -D warnings
      - run: cargo test --no-default-features
      - run: cargo publish --dry-run --all-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y librdkafka-dev libsasl2-dev
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-features
      - run: cargo build --no-default-features

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install --locked --quiet cargo-audit
      # cargo-audit re-clones the advisory DB on every run by default; caching
      # it keyed by run id keeps a fresh DB but skips the ~30s git clone.
      - name: Cache RustSec advisory DB
        uses: actions/cache@v5
        with:
          path: ~/.cargo/advisory-db
          key: cargo-audit-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            cargo-audit-db-${{ runner.os }}-
      - name: RustSec audit
        run: cargo audit --deny warnings

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for codecov-action v5 OIDC authentication; replaces the
      # long-lived CODECOV_TOKEN secret on public repos.
      id-token: write
    env:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: inmemory
            features: inmemory,metrics
          - name: rabbitmq
            features: rabbitmq,audit,rabbitmq-transactional
          - name: aws-sns-sqs
            features: pub-aws-sns,aws-sns-sqs,audit
          - name: nats
            features: nats,audit
          - name: kafka
            features: kafka,kafka-ssl,audit
          - name: redis-streams
            features: redis-streams
    steps:
      - uses: actions/checkout@v6
      - if: matrix.name == 'kafka'
        run: sudo apt-get update && sudo apt-get install -y librdkafka-dev libsasl2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install -q cargo-llvm-cov cargo-nextest --locked
      - run: cargo llvm-cov nextest --features ${{ matrix.features }} --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          slug: ${{ github.repository }}
          files: lcov.info
          disable_search: true
          flags: ${{ matrix.name }}
          name: ${{ matrix.name }}
          fail_ci_if_error: true
