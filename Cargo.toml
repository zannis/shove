[package]
name = "shove"
version = "0.14.0"
description = "Async tasks via pubsub on steroids. Comes with built-in support for complex queue configurations, audit logs, autoscaling consumer groups and more."
edition = "2024"
rust-version = "1.91"
authors = ["Zannis Kalampoukis <zkalampoukis@gmail.com>"]
license = "MIT"
repository = "https://github.com/zannis/shove"
homepage = "https://shove.rs"
documentation = "https://docs.rs/shove"
keywords = ["messaging", "rabbitmq", "pubsub", "consumer-groups", "autoscaling"]
categories = ["asynchronous"]

# This list must live in [package] to have any packaging effect: it
# previously sat below the docs.rs metadata table header, where TOML scoped
# it to that table and cargo silently ignored it — the docs site and repo
# tooling shipped in the crate despite it.
exclude = [
  "docs/",
  "benches/results/",
  # Repo tooling that reads repo-only inputs (the results dataset and the
  # committed SVGs): shipping the targets without their inputs gives the
  # tarball an example that can only fail and a test that cannot pass.
  "tests/chartgen.rs",
  "examples/chartgen.rs",
  "examples/common/chartgen.rs",
  ".pr-body.md",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "plans/",
  "tsconfig.json",
  "vocs.config.tsx",
  "wrangler.toml",
  # Anchored: the unanchored form also matched tests/scripts/, whose
  # rmq_setup.sh the packaged .config/nextest.toml requires.
  "/scripts/",
  ".github/workflows/docs-build.yml",
  ".github/workflows/docs-preview.yml",
  "node_modules/",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.clippy]
absolute-paths = "deny"

[features]
default = []

# RabbitMQ Pubsub
rabbitmq = [
  "dep:lapin",
  "dep:futures-lite",
  "dep:reqwest",
  "dep:arc-swap",
  "dep:url",
]

# Opt-in exactly-once delivery for RabbitMQ consumers via AMQP transactions.
# Makes publish-to-hold-queue + ack atomic (tx_select/tx_commit), eliminating
# the publish-then-ack race at the cost of ~10-15× lower throughput per channel.
rabbitmq-transactional = ["rabbitmq"]

# SNS Publisher
pub-aws-sns = ["dep:aws-config", "dep:aws-sdk-sns"]

# Complete pubsub with AWS SNS and AWS SQS
aws-sns-sqs = ["pub-aws-sns", "dep:aws-sdk-sqs"]

# Audit traits and default audit topic
audit = []

# NATS pubsub
nats = ["dep:async-nats", "dep:futures-util"]

# Apache Kafka pubsub
kafka = ["dep:rdkafka", "dep:futures-util"]

# TLS + SASL support for Kafka. Pulls in rdkafka's `ssl` (OpenSSL) and `sasl`
# (Cyrus SASL) features. For GSSAPI/Kerberos or a vendored OpenSSL, users can
# additionally enable `rdkafka/gssapi` or `rdkafka/ssl-vendored` downstream.
kafka-ssl = ["kafka", "rdkafka?/ssl", "rdkafka?/sasl"]

# AWS MSK IAM authentication. Adds the `MskIam` variant to `KafkaSasl`,
# which uses `SASL_SSL` + `OAUTHBEARER` with auto-refreshed presigned tokens
# signed against `kafka-cluster:Connect`. Implies TLS.
kafka-msk-iam = [
  "kafka-ssl",
  "dep:aws-config",
  "dep:aws-credential-types",
  "dep:aws-msk-iam-sasl-signer",
]

# Confluent Schema Registry decode for Kafka consumers. Adds an async, cached
# registry client and an opt-in decode stage that strips the Confluent wire
# frame and validates schema identity before delegating to the topic's codec.
kafka-schema-registry = [
  "kafka",
  "dep:reqwest",
  "dep:dashmap",
  "dep:futures-util",
]

# In-process backend
# futures-util: `FutureExt::catch_unwind`, to resolve a panicking batch
# handler to `Outcome::Retry` (see `backend::batch_consumer::invoke_batch_handler`,
# shared with Kafka's batch consumer). Same feature-edge move as `redis-streams`
# below — wires up a dependency that was already in the tree.
inmemory = ["dep:dashmap", "dep:futures-util"]

# Redis Streams pubsub
# futures-util: `FutureExt::catch_unwind`, to resolve a panicking handler to
# `Outcome::Retry` (see `backends::redis::lease::catch_handler_panic`). The
# `redis` crate already pulls it in, so this only wires up the feature edge.
redis-streams = ["dep:redis", "dep:futures-util"]

# Emit operational metrics via the `metrics` facade. Consumer services
# install their own recorder (e.g. `metrics-exporter-prometheus`) and
# expose the endpoint themselves; this crate never opens a port.
metrics = ["dep:metrics"]

# Protobuf codec via `prost`. Enables `ProtobufCodec<M>` for any
# `M: prost::Message + Default`.
protobuf = ["dep:prost"]

# Optional `from_env()` constructors for shove's tuning knobs (consumer range,
# prefetch, Kafka replication, NATS stream config) plus the prefix-scoped
# `EnvVars` reader they are built on. Opt-in and std-only: services that
# configure shove in code pay nothing, and shove never claims an unprefixed
# variable name. See `shove::env`.
env-config = []

# Simple Binary Encoding (SBE) codec. Zero-copy: topics carry `SbeFrame<T>`
# wire frames that publish and decode without re-encoding or copying, so
# handlers wrap sbe-tool-generated flyweight decoders directly over the
# received buffer. No extra dependencies.
sbe = []

# Test-only seams for integration tests (not part of the public API for normal
# builds). Currently exposes the Kafka admin OAUTHBEARER priming path so the
# OAUTHBEARER integration test can drive it against a local broker with an
# unsecured JWT (MSK's presigned-URL tokens can't be validated without AWS).
test-support = []

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tracing = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
lapin = { version = "4", features = ["rustls--ring"], optional = true }
futures-lite = { version = "2", optional = true }
reqwest = { version = "0.13", features = ["json"], optional = true }
aws-config = { version = "1", features = [
  "behavior-version-latest",
  "default-https-client",
  "rt-tokio",
], default-features = false, optional = true }
aws-credential-types = { version = "1", optional = true }
aws-msk-iam-sasl-signer = { version = "1", optional = true }
aws-sdk-sns = { version = "1", features = [
  "behavior-version-latest",
  "default-https-client",
  "rt-tokio",
], default-features = false, optional = true }
aws-sdk-sqs = { version = "1", features = [
  "behavior-version-latest",
  "default-https-client",
  "rt-tokio",
], default-features = false, optional = true }
rand = "0.10"
arc-swap = { version = "1", optional = true }
# `websockets` is already in async-nats' default set, but state it: without it
# the `ws`/`wss` connector arms are compiled out and `wss://` falls through to a
# plain TCP connection, while `is_websocket()` still suppresses the post-INFO
# TLS upgrade. Transport validation classifies `wss://` as encrypted, so that
# would be a silent downgrade rather than a build error.
async-nats = { version = "0.49", features = ["websockets"], optional = true }
bytes = "1"
futures-util = { version = "0.3", optional = true }
rdkafka = { version = "0.39", features = [
  "tokio",
  "tracing",
  "zstd",
], optional = true }
dashmap = { version = "6", optional = true }
redis = { version = "1", features = [
  "tokio-comp",
  "streams",
  "tokio-rustls-comp",
  "cluster-async",
], optional = true }
metrics = { version = "0.24", optional = true }
url = { version = "2", optional = true }
prost = { version = "0.14", optional = true }

[target.'cfg(windows)'.dependencies]
rdkafka = { version = "0.39", features = [
  "tokio",
  "tracing",
  "zstd",
  "cmake-build",
], optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio"] }
# Chart rendering for `examples/chartgen.rs`. `default-features = false` with
# only `svg_backend`/`line_series` is load-bearing, not tidiness: the default
# set enables `ttf`, which resolves text extents through system fonts. Those
# differ between a laptop and `ubuntu-latest`, so every label coordinate — and
# therefore every byte of the SVG — would move, and the committed-SVG byte-compare
# would diff red on a run that changed nothing.
plotters = { version = "0.3.7", default-features = false, features = [
  "svg_backend",
  "line_series",
] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = [
  "rabbitmq",
  "localstack",
  "nats",
  "kafka",
  "redis",
] }
# RUSTSEC-2026-0145: testcontainers 0.27.3 pulls in astral-tokio-tar 0.6.1 which
# has a known vulnerability. Pin to 0.6.2 until testcontainers ships a fix.
astral-tokio-tar = "0.6.2"
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
rand = "0.10"
metrics-util = "0.20"
libc = "0.2"
axum = "0.8"
[target.'cfg(target_os = "macos")'.dev-dependencies]
mach2 = "0.6"

[[bench]]
name = "autoscaler"
harness = false
required-features = ["rabbitmq"]

# Tier A — consumer-count scaling over the in-process backend. No Docker.
[[bench]]
name = "consumer_overhead"
harness = false
required-features = ["inmemory"]

# Tier A — the flow coverage matrix over the in-process backend. No Docker.
[[bench]]
name = "inmemory_flows"
harness = false
required-features = ["inmemory"]

# Tier A — broker-free paths. Deliberately ungated: this target is what proves
# the bench code builds under `--no-default-features`.
[[bench]]
name = "pure_paths"
harness = false

[[bench]]
name = "publish_throughput"
harness = false
required-features = ["rabbitmq"]

