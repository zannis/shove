codecov:
  notify:
    after_n_builds: 6
    wait_for_ci: true

coverage:
  status:
    patch:
      default:
        # New / changed lines on a PR should be 80% covered. `informational`
        # reports the result without failing the Codecov check — flip to
        # `informational: false` once the gate has been calibrated.
        target: 80%
        informational: true

ignore:
  - "tests/**"
  - "benches/**"
  - "examples/**"

flag_management:
  default_rules:
    carryforward: true

flags:
  inmemory:
    carryforward: true
  rabbitmq:
    carryforward: true
  aws-sns-sqs:
    carryforward: true
  nats:
    carryforward: true
  kafka:
    carryforward: true
  redis-streams:
    carryforward: true