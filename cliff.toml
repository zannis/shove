[changelog]
header = ""
body = """
{% set breaking = commits | filter(attribute="breaking", value=true) %}\
{% if breaking | length > 0 %}
### ⚠ Breaking Changes
{% for commit in breaking %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}\
{% endfor %}
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
# Keep unconventional subjects rather than dropping them. Squash-merged PRs
# whose title is prose instead of `type: subject` used to vanish from the notes
# entirely -- v0.11.2 shipped with an empty body for exactly this reason. The
# catch-all parser below files them under "Miscellaneous".
filter_unconventional = false
split_commits = false
commit_parsers = [
    { message = "^feat(\\(.+\\))?!?:", group = "Features" },
    { message = "^fix(\\(.+\\))?!?:", group = "Bug Fixes" },
    { message = "^refactor(\\(.+\\))?!?:", group = "Refactor" },
    { message = "^perf(\\(.+\\))?!?:", group = "Performance" },
    { message = "^test(\\(.+\\))?!?:", group = "Testing" },
    { message = "^docs?(\\(.+\\))?!?:", group = "Documentation" },
    { message = "^chore(\\(.+\\))?!?:", group = "Miscellaneous" },
    { message = "^ci(\\(.+\\))?!?:", skip = true },
    { message = "^release", skip = true },
    { message = ".*", group = "Miscellaneous" },
]
filter_commits = false
tag_pattern = "v[0-9].*"